name: StockSignalMonitorApple

options:
  bundleIdPrefix: com.mars9399
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  StockSignalCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 2.5.1

targets:
  StockSignalMonitorMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes:
          - Resources/StockSignalMonitorMac.entitlements
    dependencies:
      - package: StockSignalCore
        product: StockSignalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mars9399.StockSignalMonitor.macOS
        PRODUCT_NAME: StockSignalMonitorMac
        CODE_SIGN_ENTITLEMENTS: macOS/Resources/StockSignalMonitorMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: 美股信号监控
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Mars9399
    entitlements:
      path: macOS/Resources/StockSignalMonitorMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  StockSignalMonitorIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
    dependencies:
      - package: StockSignalCore
        product: StockSignalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mars9399.StockSignalMonitor.iOS
        PRODUCT_NAME: StockSignalMonitorIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: 美股信号监控
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 连接您自行配置的 IBKR Client Portal Gateway 以读取行情。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  StockSignalMonitorMac:
    build:
      targets:
        StockSignalMonitorMac: all
    run:
      config: Debug
    archive:
      config: Release
  StockSignalMonitorIOS:
    build:
      targets:
        StockSignalMonitorIOS: all
    run:
      config: Debug
    archive:
      config: Release
