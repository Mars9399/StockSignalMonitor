name: Apple builds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: ./apple/scripts/bootstrap.sh
      - name: Test shared core
        working-directory: apple
        run: swift test
      - name: Build macOS app
        run: xcodebuild -project apple/StockSignalMonitorApple.xcodeproj -scheme StockSignalMonitorMac -configuration Debug -destination 'platform=macOS' -derivedDataPath apple/.derivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS app
        run: xcodebuild -project apple/StockSignalMonitorApple.xcodeproj -scheme StockSignalMonitorIOS -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath apple/.derivedData CODE_SIGNING_ALLOWED=NO build
