name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: ./setup.ps1
      - name: Test positions and desktop UI
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Build Windows application
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StockSignalMonitor-Windows
          path: build-output/StockSignalMonitor/
          if-no-files-found: error
